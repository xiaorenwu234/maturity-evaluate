apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: kgb-demo
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: python:3.11-slim
        command: ["python", "-c", "import http.server; http.server.test(HandlerClass=http.server.SimpleHTTPRequestHandler, port=8080)"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: kgb-demo
spec:
  selector:
    app: inventory-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
