# Example configuration for `kgb build --config config.yaml`
# Precedence (later wins): this file < KGB_* env vars < CLI overrides.

# Graph namespace (repo / tenant id). Optional.
namespace: ""

# Output JSON path can also be set here (CLI -o wins).
# output_path: out/knowledge_graph.json

# Run LLM semantic enrichment (default: true). Set false to build structure only.
enrich: true

# --- Semantic enrichment: OpenAI-compatible endpoint via LangChain ---
# No heuristic fallback: when enrich is true these MUST be provided or the build fails.
llm:
  provider: openai
  model: gpt-4o-mini                       # e.g. qwen-max, deepseek-chat, ...
  base_url: https://api.openai.com/v1      # point at any OpenAI-compatible gateway
  api_key: sk-xxxx                         # or set env KGB_LLM__API_KEY / OPENAI_API_KEY
  temperature: 0
  # max_output_tokens: 2048
  request_timeout: 60
  json_mode: true                          # request response_format=json_object
  max_items_per_call: 40                   # entities described per model call

# --- Source-code collector (Python via stdlib ast; JS/TS/Java/Go via Tree-sitter) ---
code:
  enabled: true
  languages: ["auto"]
  exclude_dirs:
    - node_modules
    - .git
    - venv
    - .venv
    - __pycache__
    - dist
    - build
    - target
    - vendor
  max_file_bytes: 512000

# --- Open-source code collector (scip-python + radon + tree-sitter) ---
# When enabled, replaces the legacy CodeCollector entirely.
# Requires: pip install -e ".[code_analysis]" and Node.js >= 16 for scip-python.
# Hard-failure: collection aborts if any toolkit is missing.
code_analysis:
  enabled: false

# --- Document collector (architecture / interface / config docs) ---
document:
  enabled: true

# --- Deployment collector (Kubernetes + Alibaba Cloud) ---
# Requires: pip install -e ".[alicloud]" for Alibaba Cloud SDK dependencies.
# Credentials: set ALIBABA_CLOUD_ACCESS_KEY_ID / ALIBABA_CLOUD_ACCESS_KEY_SECRET env vars.
deployment:
  enabled: false
  aliyun_region: cn-hongkong
  # AK/SK prefer env vars; can also be set inline (not recommended for production)
  # aliyun_access_key_id: ""
  # aliyun_access_key_secret: ""

  # K8s / ACK
  cluster_id: null           # ACK cluster ID (triggers ACK collector)
  kubeconfig: null           # single kubeconfig path
  kubeconfig_paths: []       # multiple kubeconfig paths
  context: null              # kubeconfig context name
  namespaces: []             # empty = all namespaces
  cluster_name: default

  # Alibaba Cloud products (set enabled: true for each you want to collect)
  ecs:
    enabled: false
  rds:
    enabled: false
    instance_ids: []         # optional: specific RDS instance IDs
  oss:
    enabled: false
    bucket_names: []         # optional: specific OSS bucket names
  sls:
    enabled: false
    project: ""              # SLS project name
    logstores: []            # optional: specific logstore names
  cms:
    enabled: false
  ros:
    enabled: false
    stack_names: []          # optional: specific ROS stack names
  acr:
    enabled: false
    instance_ids: []
    otel_only: true
  alb:
    enabled: false
    load_balancer_ids: []
  arms:
    enabled: false
  fc:
    enabled: false
    function_names: []       # optional: specific FC function names
  eventbridge:
    enabled: false
    bus_names: []
  grafana:
    enabled: false
    url: ""                  # Grafana URL
    workspace_id: ""         # Alibaba Managed Grafana workspace ID
    api_token_env: GRAFANA_API_TOKEN  # env var holding the API token
    folder_ids: []
    tags: []
  gtm:
    enabled: false
  tair:
    enabled: false
    instance_ids: []
  codeup:
    enabled: false
    org_id: ""
    project_name: ""
    yunxiao_token_env: YUNXIAO_TOKEN  # env var holding Yunxiao token
    repo_ids: []
    pipeline_ids: []

# --- Runtime metrics / logs / traces collector — currently a STUB ---
runtime:
  enabled: false
  prometheus_url: null
  trace_backend: null
